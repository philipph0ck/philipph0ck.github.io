<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philipp Hock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #fafaf7;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-muted: #6b6b6b;
            --text-subtle: #9a9a9a;
            --border: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(0, 0, 0, 0.2);
            --accent: #1a1a1a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e0e0e;
                --surface: #1a1a1a;
                --text: #f5f5f5;
                --text-muted: #a0a0a0;
                --text-subtle: #6b6b6b;
                --border: rgba(255, 255, 255, 0.1);
                --border-hover: rgba(255, 255, 255, 0.3);
                --accent: #f5f5f5;
            }
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 520px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 500;
            color: var(--text-muted);
            margin: 0 auto 1.75rem;
            letter-spacing: 0.02em;
        }

        h1 {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--text-subtle);
            letter-spacing: 0.08em;
            text-transform: lowercase;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .bio {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 440px;
            margin: 0 auto 2.5rem;
            line-height: 1.7;
        }

        .links {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            color: var(--text);
            text-decoration: none;
            font-weight: 400;
            transition: all 0.2s ease;
        }

        .link:hover {
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .link svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        footer {
            position: fixed;
            bottom: 1.5rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-subtle);
            letter-spacing: 0.05em;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.6rem;
            }
            .bio {
                font-size: 0.95rem;
            }
            .links {
                flex-direction: column;
                align-items: stretch;
            }
            .link {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="avatar">PH</div>
        
        <h1>Philipp Hock</h1>
        <p class="subtitle">software engineer</p>
        
        <p class="bio">
            Kurze Bio hier — wer du bist, was du machst, was dich antreibt.
            Zwei bis drei Sätze reichen völlig, um einen Eindruck zu hinterlassen.
        </p>
        
        <div class="links">
            <a href="https://www.linkedin.com/in/DEIN-PROFIL/" class="link" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.063 2.063 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
                LinkedIn
            </a>
            
            <a href="lebenslauf.pdf" class="link" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                Lebenslauf
            </a>
            
            <a href="mailto:deine@email.de" class="link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                </svg>
                Kontakt
            </a>
        </div>
    </main>

    <footer>
        © 2026 Philipp Hock
    </footer>
</body>
</html>
